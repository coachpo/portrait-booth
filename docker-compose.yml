services:
  app:
    build: .
    ports:
      # 只绑本机：Secure Cookie 需要 HTTPS，对外必须经过一层 TLS 终止
      - "127.0.0.1:8000:8000"
    environment:
      # 缺失时让 compose 直接失败，而不是把空串传进去换来一个随机密钥
      - PORTRAIT_SECRET_KEY_BASE=${PORTRAIT_SECRET_KEY_BASE:?必须提供持久根密钥，见 .env.example}
    volumes:
      - portrait-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  portrait-data:
