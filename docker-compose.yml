services:
  app:
    build: .
    ports:
      # Bind to localhost only: Secure cookies require HTTPS, so anything
      # exposed must sit behind a TLS-terminating layer
      - "127.0.0.1:8000:8000"
    environment:
      # Fail compose outright when missing, instead of passing an empty string
      # that would silently trade in a random key
      - PORTRAIT_SECRET_KEY_BASE=${PORTRAIT_SECRET_KEY_BASE:?a persistent root secret is required; see .env.example}
    volumes:
      - portrait-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  portrait-data:
